        left: 50%;

        z-index: 1000;

        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 9999;
        display: flex;

        color: #333;

      }

        color: #555;
      }
      
      .popup img {
        max-width: 100%;
        height: auto;
        margin: 10px 0;
        border: 1px solid #ddd;
      }
      
      .popup-close {
        position: absolute;
        top: 10px;
        right: 15px;
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #666;

      // ASCII pattern elements system
      const patternCount = 25; // Reduced count for better performance
      const patternElements = [];
      const patternVelocities = [];
      const patternRotations = [];

      // Create ASCII pattern elements
      for (let i = 0; i < patternCount; i++) {
        const pattern =
          asciiPatterns[Math.floor(Math.random() * asciiPatterns.length)];
        const maxWidth = Math.max(...pattern.map((line) => line.length));
        const maxHeight = pattern.length;

        // Create a group to hold all the text sprites for this pattern
        const patternGroup = new THREE.Group();

        // Create individual text sprites for each character in the pattern
        const patternSprites = [];
        let charIndex = 0;

        for (let row = 0; row < pattern.length; row++) {
          const line = pattern[row];
          for (let col = 0; col < line.length; col++) {
            const char = line[col];

            // Create canvas for this character
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            canvas.width = 64;
            canvas.height = 64;

            // Set font and style
            context.font = "32px SourceCodePro, monospace";
            context.fillStyle = "rgba(60, 60, 60, 0.8)";
            context.textAlign = "center";
            context.textBaseline = "middle";

            // Draw character
            context.fillText(char, 32, 32);

            // Create texture and sprite
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({
              map: texture,
              transparent: true,
              opacity: 0.8,
              alphaTest: 0.1,
            });

            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(0.5, 0.5, 1);

            // Position character within pattern
            sprite.position.set(
              (col - maxWidth / 2) * 0.6,
              (maxHeight / 2 - row) * 0.6,
              0
            );

            patternGroup.add(sprite);
            patternSprites.push(sprite);
            charIndex++;
          }
        }

        // Random position in 3D space
        patternGroup.position.set(
          (Math.random() - 0.5) * 60,
          (Math.random() - 0.5) * 40,
          (Math.random() - 0.5) * 60
        );

        // Random initial rotation
        patternGroup.rotation.set(
          (Math.random() - 0.5) * Math.PI,
          (Math.random() - 0.5) * Math.PI,
          (Math.random() - 0.5) * Math.PI
        );

        // Store pattern data
        patternElements.push({
          group: patternGroup,
          sprites: patternSprites,
          pattern: pattern,
          maxWidth: maxWidth,
          maxHeight: maxHeight,
        });

        // Random velocities for floating and jittering motion
        patternVelocities.push({
          x: (Math.random() - 0.5) * 0.01,
          y: (Math.random() - 0.5) * 0.01,
          z: (Math.random() - 0.5) * 0.01,

          jitterY: (Math.random() - 0.5) * 0.005,
          jitterZ: (Math.random() - 0.5) * 0.005,
        });

        // Store base positions for jittering
        patternRotations.push({
          baseX: patternGroup.position.x,
          baseY: patternGroup.position.y,
          baseZ: patternGroup.position.z,
          time: Math.random() * Math.PI * 2,
        });

      // Preload all images in parallel for faster loading
      function preloadImages() {
        const loadPromises = artistImages.map((artist) => {
          return new Promise((resolve, reject) => {
            const texture = textureLoader.load(
              artist.path,
              (loadedTexture) => {
                // Optimize texture settings for better performance
                loadedTexture.generateMipmaps = false;
                loadedTexture.minFilter = THREE.LinearFilter;
                loadedTexture.magFilter = THREE.LinearFilter;
                loadedTexture.format = THREE.RGBAFormat;
                loadedTexture.flipY = true;

                resolve({ artist, texture: loadedTexture });
              },
              undefined,
              (error) => {
                console.warn(`Failed to load image: ${artist.path}`, error);
                reject(error);
              }
            );
          });
        });

        return Promise.all(loadPromises);
      }

      // Function to create connections between images (optimized)
      function createConnections() {
        // Reduce number of connections for better performance
        const maxConnections = Math.min(imagePlanes.length * 0.5, 20); // Limit total connections
        let connectionCount = 0;

        for (
          let i = 0;
          i < imagePlanes.length && connectionCount < maxConnections;
          i++
        ) {
          // Each image connects to 1-2 other images (reduced from 1-3)
          const numConnections = Math.floor(Math.random() * 2) + 1;
          const connectedIndices = new Set();

          // Ensure we don't connect to the same image
          while (
            connectedIndices.size < numConnections &&
            connectedIndices.size < imagePlanes.length - 1 &&
            connectionCount < maxConnections
          ) {
            const randomIndex = Math.floor(Math.random() * imagePlanes.length);
            if (randomIndex !== i) {
              connectedIndices.add(randomIndex);
            }
          }

          // Create lines to connected images
          connectedIndices.forEach((targetIndex) => {
            if (connectionCount >= maxConnections) return;

            const startPos = imagePlanes[i].position;
            const endPos = imagePlanes[targetIndex].position;

            // Create line geometry
            const points = [
              new THREE.Vector3(startPos.x, startPos.y, startPos.z),
              new THREE.Vector3(endPos.x, endPos.y, endPos.z),
            ];

            const geometry = new THREE.BufferGeometry().setFromPoints(points);

            // Create line material with optimized settings
            const material = new THREE.LineBasicMaterial({
              color: 0x666666,
        transparent: true,
              opacity: 0.4,
              linewidth: 1,
              depthTest: true,
              depthWrite: false,
              vertexColors: false, // Disable vertex colors for performance
            });

            const line = new THREE.Line(geometry, material);
            line.renderOrder = -1; // Render before other objects
            line.frustumCulled = true; // Enable frustum culling
            connectionLines.push(line);
            scene.add(line);
            connectionCount++;
          });
        }
      }

      // Camera position
      camera.position.z = 15;

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      controls.enableZoom = true;
      controls.enablePan = true;

      // Performance optimization variables
      let frameCount = 0;
      const updateFrequency = 2; // Update sprites every 2 frames instead of every frame
      const frustum = new THREE.Frustum();
      const cameraMatrix = new THREE.Matrix4();

      // Rotation animation variables
      let rotationStartTime = null;
      const rotationDuration = 3000; // 3 seconds in milliseconds
      let isRotating = false;

      // Easing function for smooth rotation (ease-in-out)
      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      // Optimized animation loop
      function animate() {
        requestAnimationFrame(animate);
        frameCount++;

        // Update camera matrix for frustum culling
        cameraMatrix.multiplyMatrices(
          camera.projectionMatrix,
          camera.matrixWorldInverse
        );
        frustum.setFromProjectionMatrix(cameraMatrix);

        // Update ASCII pattern positions with jittering motion (reduced frequency for performance)
        if (frameCount % updateFrequency === 0) {
          for (let i = 0; i < patternCount; i++) {
            const patternElement = patternElements[i];
            const velocity = patternVelocities[i];
            const rotation = patternRotations[i];
            const group = patternElement.group;

            // Update time for jittering
            rotation.time += 0.02;

            // Calculate jittering offset using sine waves for smooth motion
            const jitterOffsetX =
              Math.sin(rotation.time * 0.7) * velocity.jitterX;
            const jitterOffsetY =
              Math.sin(rotation.time * 0.9) * velocity.jitterY;
            const jitterOffsetZ =
              Math.sin(rotation.time * 0.5) * velocity.jitterZ;

            // Update positions with floating and jittering motion
            group.position.x =
              rotation.baseX + jitterOffsetX + velocity.x * updateFrequency;
            group.position.y =
              rotation.baseY + jitterOffsetY + velocity.y * updateFrequency;
            group.position.z =
              rotation.baseZ + jitterOffsetZ + velocity.z * updateFrequency;

            // Update base positions for floating motion
            rotation.baseX += velocity.x * updateFrequency;
            rotation.baseY += velocity.y * updateFrequency;
            rotation.baseZ += velocity.z * updateFrequency;

            // Boundary checking - wrap around instead of bounce
            if (Math.abs(rotation.baseX) > 30) {
              rotation.baseX = rotation.baseX > 0 ? -30 : 30;
            }
            if (Math.abs(rotation.baseY) > 20) {
              rotation.baseY = rotation.baseY > 0 ? -20 : 20;
            }
            if (Math.abs(rotation.baseZ) > 30) {
              rotation.baseZ = rotation.baseZ > 0 ? -30 : 30;
            }

            // Add subtle rotation to pattern groups
            group.rotation.x += velocity.rotationX * updateFrequency;
            group.rotation.y += velocity.rotationY * updateFrequency;
            group.rotation.z += velocity.rotationZ * updateFrequency;

            // Make patterns face the camera (billboard effect)
            group.lookAt(camera.position);
          }
        }

        // Handle rotation animation
        if (isRotating && rotationStartTime !== null) {
          const currentTime = Date.now();
          const elapsed = currentTime - rotationStartTime;
          const progress = Math.min(elapsed / rotationDuration, 1);

          if (progress < 1) {
            // Apply easing and rotate around Y-axis
            const easedProgress = easeInOutCubic(progress);
            const rotationAngle = (easedProgress * Math.PI) / 4; // Rotate 45 degrees (π/4 radians) to the left

            // Rotate the entire scene around Y-axis
            scene.rotation.y = rotationAngle;
          } else {
            // Animation complete
            isRotating = false;
            scene.rotation.y = Math.PI / 4; // Final rotation position
          }
        }

        // Optimized billboard behavior with frustum culling
        imagePlanes.forEach((plane) => {
          // Only update billboard behavior if plane is in view
          if (frustum.intersectsObject(plane)) {
            plane.lookAt(camera.position);
            plane.visible = true;
          } else {
            plane.visible = false; // Hide objects outside frustum
          }
        });

        controls.update();
        renderer.render(scene, camera);
      }

      // Optimized window resize handler
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Start animation
      animate();
      
      // ASCII Particles System with Clickable Popups
      class ASCIIParticles {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext('2d');
          this.structures = [];
          this.animationId = null;
          
          // Configuration
          this.config = {
            maxStructures: 6,
            fontSize: 12,
            fade: 0.08,
            color: 'rgba(51, 51, 51, 0.8)',
            fontFamily: 'SourceCodePro, monospace',
            writeSpeed: 0.05,
            eraseSpeed: 0.04,
            structureLifetime: 3000,
            spawnRate: 0.02,
            typewriterSound: true
          };
          
          // ASCII art patterns for background only
          this.asciiPatterns = [
            ['  +---+', '  |   |', '  +---+'],
            ['   /\\', '  /  \\', ' /____\\'],
            ['  *', ' ***', '*****', ' ***', '  *'],
            ['[OK]', 'LOAD', 'RUN'],
            ['     _______', '    |.-----.|', '    ||     ||', '    ||_____/|', '    | .     |', '    |-|-  oo|', '    |  _ _  |', '    |       /', '    `""""""`'],
            ['    =/\\                 /\\=', '    / \\._   (\\_/)   _./\\', '   / .\'\'._\'--(o.o)--\'_.\'\'\\', '  /.\' _/ |`=/ " \\=`| \\_ `.\\', ' /` .\' \\;-,\'\\___/\',-;/ `. \'\\', '/.-\'      `\\(-V-)/`       `-.\\', '`            "   "'],
            [' ________________________', '|.----------------------.|', '||                      ||', '||       ______         ||', '||     .;;;;;;;;.       ||', '||    /;;;;;;;;;;;\\     ||', '||   /;/`    `-;;;;; . .||', '||   |;|__  __  \\;;;|   ||', '||.-.|;| e`/e`  |;;;|   ||', '||   |;|  |     |;;;|\\\'--||', '||   |;|  \\\'-    |;;;|   ||', '||   |;;\\ --\'  /|;;;|   ||', '||   |;;;;;---\'\\|;;;|   ||', '||   |;;;;|     |;;;|   ||', '||   |;;.-\'     |;;;|   ||', '||\\\'--|/`        |;;;|--.||', '||;;;;    .     ;;;;.\\;;||', '||;;;;;-.;_    /.-;;;;;;||', '||;;;;;;;;;;;;;;;;;;;;;;||', '||jgs;;;;;;;;;;;;;;;;;;;||', '\\\'------------------------\\\'']
          ];
          
          // Artist information database
          this.artists = [
            {
              name: 'Anat Saacks',
              title: 'A Bird to Remember',
              medium: 'Photo, wooden and plexiglass box, stones, digital projection, LLM, 2025',
              description: 'A realistic photo of a bird, found dead at the entrance to the artist\'s home, stands at the heart of a conversation with an AI-powered language model (LLM), which operates as an emotion- simulating entity that is asked to respond to casual loss. The work underscores the emotional gap between humans and machines: between direct documentation of death and an algorithm that offers what it identifies as emotion, solace, interpretation, and memory.',
              bio: 'Saaks is a graphic designer and visual artist. She is a lecturer at HIT Holon Institute of Technology, the owner of A designstudio for design and branding, as well as a social activist and volunteer at a mental health organization.',
              images: [
                'assets/Artists/Anat Saacks/AS02 - anat saacks.jpg',
                'assets/Artists/Anat Saacks/AS03 - anat saacks.jpg',
                'assets/Artists/Anat Saacks/AS04 - anat saacks.jpg',
                'assets/Artists/Anat Saacks/AS05 - anat saacks.jpg',
                'assets/Artists/Anat Saacks/Anat Saacks.jpg'
              ]
            },
            {
              name: 'Chenn Hearthstone',
              title: 'Bill of Rights',
              medium: 'ChatGPT, Fooocus, Runway, Illustrator, 2025',
              description: 'Imagine a future world with robots that develop sophisticated emotions and humans upload their consciousness to the digital cloud. What would the concept of "human rights" look like in such a world? The work presents a new bill of rights, created after a deep conversation with ChatGPT about the new complexities of this hypothetical world. The conversation led to the formulation of five basic rights that apply to anyone who exists in any shape or form of life – be it human or mechanical.',
              bio: 'Chenn Hearthstone is a visual artist who started working with digital tools recently, after being diagnosed with a genetic syndrome that affects her ability to rely predominantly on her hands.',
              images: [
                'assets/Artists/Chenn Hearthstone/Chenn Hearthstone_placeholder.png'
              ],
              videoLink: 'https://www.youtube.com/watch?v=dAo9QeZ5zxo'
            }
          ];
          
          this.init();
        }
        
        init() {
          this.resize();
          this.start();
          
          // Handle window resize
          window.addEventListener('resize', () => this.resize());
          
          // Handle visibility change
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
              this.stop();
            } else {
              this.start();
            }
          });
          
          // Click handling is now done in Three.js scene
        }
        
        resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.canvas.width = window.innerWidth * dpr;
          this.canvas.height = window.innerHeight * dpr;
          this.canvas.style.width = window.innerWidth + 'px';
          this.canvas.style.height = window.innerHeight + 'px';
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        
        createStructure() {
          const pattern = this.asciiPatterns[Math.floor(Math.random() * this.asciiPatterns.length)];
          const maxWidth = Math.max(...pattern.map(line => line.length));
          const maxHeight = pattern.length;
          
          const totalChars = pattern.reduce((sum, line) => sum + line.length, 0);
          
          return {
            pattern: pattern,
            x: Math.random() * (this.canvas.width - maxWidth * this.config.fontSize),
            y: Math.random() * (this.canvas.height - maxHeight * this.config.fontSize),
            maxWidth: maxWidth,
            maxHeight: maxHeight,
            writeProgress: 0,
            eraseProgress: 0,
            state: 'writing',
            startTime: Date.now(),
            totalChars: totalChars,
            currentChar: 0,
            lastCharTime: 0,
            charDelay: 50
          };
        }
        
        updateStructure(structure) {
          const now = Date.now();
          const elapsed = now - structure.startTime;
          
          if (structure.state === 'writing') {
            if (now - structure.lastCharTime >= structure.charDelay && structure.currentChar < structure.totalChars) {
              structure.currentChar++;
              structure.lastCharTime = now;
            }
            
            structure.writeProgress = structure.currentChar / structure.totalChars;
            
            if (structure.writeProgress >= 1) {
              structure.writeProgress = 1;
              structure.state = 'visible';
              structure.visibleTime = now;
            }
          } else if (structure.state === 'visible') {
            if (elapsed > this.config.structureLifetime) {
              structure.state = 'erasing';
            }
          } else if (structure.state === 'erasing') {
            if (now - structure.lastCharTime >= structure.charDelay && structure.currentChar > 0) {
              structure.currentChar--;
              structure.lastCharTime = now;
            }
            
            structure.eraseProgress = 1 - (structure.currentChar / structure.totalChars);
            
            if (structure.eraseProgress >= 1) {
              return false;
            }
          }
          
          return true;
        }
        
        drawStructure(structure) {
          this.ctx.font = `${this.config.fontSize}px ${this.config.fontFamily}`;
          this.ctx.fillStyle = this.config.color;
          this.ctx.textAlign = 'left';
          this.ctx.textBaseline = 'top';
          
          let charCount = 0;
          
          for (let row = 0; row < structure.pattern.length; row++) {
            const line = structure.pattern[row];
            const y = structure.y + row * this.config.fontSize;
            
            for (let col = 0; col < line.length; col++) {
              const char = line[col];
              const x = structure.x + col * this.config.fontSize;
              
              if (structure.state === 'writing') {
                if (charCount < structure.currentChar) {
                  this.ctx.fillText(char, x, y);
                }
              } else if (structure.state === 'visible') {
                this.ctx.fillText(char, x, y);
              } else if (structure.state === 'erasing') {
                if (charCount >= structure.currentChar) {
                  this.ctx.fillText(char, x, y);
                }
              }
              
              charCount++;
            }
          }
        }
        
        drawClickableArea() {
          // No longer needed - using HTML clickable areas instead
        }
        
        handleArtistClick(artistName) {
          console.log('Artist clicked:', artistName);
          const artist = this.artists.find(a => a.name === artistName);
          if (artist) {
            console.log('Opening popup for:', artistName);
            this.showArtistPopup(artist);
          } else {
            console.log('Artist not found:', artistName);
          }
        }
        
        showArtistPopup(artist) {
          console.log('showArtistPopup called with:', artist);
          
          // Remove existing popup
          const existingPopup = document.querySelector('.popup-overlay');
          if (existingPopup) {
            console.log('Removing existing popup');
            existingPopup.remove();
          }
          
          // Create popup overlay
          const overlay = document.createElement('div');
          overlay.className = 'popup-overlay';
          console.log('Created overlay element');
          
          // Create popup content with carousel
          const popup = document.createElement('div');
          popup.className = 'popup';
          popup.innerHTML = `
            <button class="popup-close">&times;</button>
            <h2>${artist.name}</h2>
            <h3>${artist.title}</h3>
            <p><strong>Medium:</strong> ${artist.medium}</p>
            <p>${artist.description}</p>
            <p><strong>About the Artist:</strong><br>${artist.bio}</p>
            
            ${artist.videoLink ? `
              <div style="margin: 20px 0;">
                <h4>Video:</h4>
                <div style="position: relative; width: 100%; height: 0; padding-bottom: 56.25%; margin: 10px 0;">
                  <iframe 
                    src="${artist.videoLink.replace('watch?v=', 'embed/')}" 
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 8px;"
                    allowfullscreen>
                  </iframe>
                </div>
                <p style="text-align: center; margin-top: 10px;">
                  <a href="${artist.videoLink}" target="_blank" style="color: #666; text-decoration: none; font-size: 14px;">
                    Open in YouTube ↗
                  </a>
                </p>
              </div>
            ` : ''}
            
            <div style="margin-top: 20px;">
              <div id="carousel-container" style="position: relative; width: 100%; height: 60vh; overflow: hidden; border: 1px solid #ddd; border-radius: 4px;">
                <img id="carousel-image" src="${artist.images[0]}" style="width: 100%; height: 100%; object-fit: cover;" />
                ${artist.images.length > 1 ? `
                  <button id="carousel-prev" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: white; border: none; padding: 15px; cursor: pointer; border-radius: 50%; font-size: 18px; font-weight: bold;">&lt;</button>
                  <button id="carousel-next" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: white; border: none; padding: 15px; cursor: pointer; border-radius: 50%; font-size: 18px; font-weight: bold;">&gt;</button>
                  <div id="carousel-indicators" style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;">
                    ${artist.images.map((_, index) => `<div class="indicator" style="width: 12px; height: 12px; border-radius: 50%; background: ${index === 0 ? '#333' : '#ccc'}; cursor: pointer; transition: background 0.3s;"></div>`).join('')}
                  </div>
                ` : ''}
              </div>
            </div>
          `;
          
          overlay.appendChild(popup);
          document.body.appendChild(overlay);
          console.log('Popup added to DOM');
          console.log('Overlay element:', overlay);
          console.log('Popup element:', popup);
          console.log('Body children count:', document.body.children.length);
          
          // Carousel functionality (only if multiple images)
          if (artist.images.length > 1) {
            let currentImageIndex = 0;
            const carouselImage = popup.querySelector('#carousel-image');
            const indicators = popup.querySelectorAll('.indicator');
            
            const updateCarousel = (index) => {
              carouselImage.src = artist.images[index];
              indicators.forEach((indicator, i) => {
                indicator.style.background = i === index ? '#333' : '#ccc';
              });
              currentImageIndex = index;
            };
            
            popup.querySelector('#carousel-prev').addEventListener('click', () => {
              const newIndex = currentImageIndex > 0 ? currentImageIndex - 1 : artist.images.length - 1;
              updateCarousel(newIndex);
            });
            
            popup.querySelector('#carousel-next').addEventListener('click', () => {
              const newIndex = currentImageIndex < artist.images.length - 1 ? currentImageIndex + 1 : 0;
              updateCarousel(newIndex);
            });
            
            indicators.forEach((indicator, index) => {
              indicator.addEventListener('click', () => {
                updateCarousel(index);
              });
            });
          }
          
          // Close popup handlers
          const closePopup = () => {
            overlay.remove();
          };
          
          popup.querySelector('.popup-close').addEventListener('click', closePopup);
          overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closePopup();
          });
        }
        
        animate() {
          this.ctx.fillStyle = `rgba(192, 208, 208, ${this.config.fade})`;
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          
          if (this.structures.length < this.config.maxStructures && Math.random() < this.config.spawnRate) {
            this.structures.push(this.createStructure());
          }
          
          this.structures = this.structures.filter(structure => {
            const keep = this.updateStructure(structure);
            if (keep) {
              this.drawStructure(structure);
            }
            return keep;
          });
          
          // No longer drawing clickable area - using HTML areas instead
          
          this.animationId = requestAnimationFrame(() => this.animate());
        }
        
        start() {
          if (!this.animationId) {
            this.animate();
          }
        }
        
        stop() {
          if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
          }
        }
      }
      
      // Initialize ASCII particles
      const asciiCanvas = document.getElementById('ascii-canvas');
      const asciiParticles = new ASCIIParticles(asciiCanvas);
    </script>
  </body>
