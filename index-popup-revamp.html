      // Scene setup
      const scene = new THREE.Scene();

      // Detect mobile device
      const isMobile =
        /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
          navigator.userAgent
        ) || window.innerWidth <= 768;

      // Adjust camera FOV for mobile
      const cameraFOV = isMobile ? 60 : 75;
      const camera = new THREE.PerspectiveCamera(
        cameraFOV,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      const renderer = new THREE.WebGLRenderer({
        antialias: !isMobile, // Disable antialiasing on mobile for better performance
        powerPreference: isMobile ? "low-power" : "high-performance", // Use low-power mode on mobile
        alpha: true, // Enable transparency
      });
      renderer.shadowMap.enabled = false; // Disable shadows for better performance

      // Adjust pixel ratio for mobile
      const pixelRatio = isMobile
        ? Math.min(window.devicePixelRatio, 1.5)
        : Math.min(window.devicePixelRatio, 2);
      renderer.setPixelRatio(pixelRatio);

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0); // Transparent background
      document.body.appendChild(renderer.domElement);

      // Add double-click handler to Three.js canvas (desktop)
      if (!isMobile) {
        renderer.domElement.addEventListener("dblclick", onImageClick);
      } else {
        // Add double-tap support for mobile devices
        let lastTapTime = 0;
        let lastTapX = 0;
        let lastTapY = 0;
        let touchStartTime = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        const doubleTapDelay = 400; // Maximum time between taps (ms)
        const tapMovementThreshold = 30; // Maximum movement for a valid tap (pixels)

        renderer.domElement.addEventListener("touchstart", (event) => {
          touchStartTime = Date.now();
          touchStartX = event.touches[0].clientX;
          touchStartY = event.touches[0].clientY;
        });

        renderer.domElement.addEventListener("touchend", (event) => {
          const touchEndTime = Date.now();
          const touchDuration = touchEndTime - touchStartTime;
          const touchEndX = event.changedTouches[0].clientX;
          const touchEndY = event.changedTouches[0].clientY;
          const touchDistance = Math.sqrt(
            Math.pow(touchEndX - touchStartX, 2) +
              Math.pow(touchEndY - touchStartY, 2)
          );

          // Check if this was a quick tap (not a drag)
          if (touchDuration < 300 && touchDistance < tapMovementThreshold) {
            const currentTime = touchEndTime;
            const timeSinceLastTap = currentTime - lastTapTime;

            // Check if this is close to the last tap position
            const distanceFromLastTap = Math.sqrt(
              Math.pow(touchEndX - lastTapX, 2) +
                Math.pow(touchEndY - lastTapY, 2)
            );

            // If double-tap detected (within time window and position threshold)
            if (
              timeSinceLastTap < doubleTapDelay &&
              timeSinceLastTap > 0 &&
              distanceFromLastTap < tapMovementThreshold
            ) {
              console.log("Double-tap detected!");
              event.preventDefault();
              event.stopPropagation();

              // Create a synthetic event with proper coordinates
              const syntheticEvent = {
                clientX: touchEndX,
                clientY: touchEndY,
                type: "doubletap",
              };
              onImageClick(syntheticEvent);

              // Reset to prevent triple-tap triggering
              lastTapTime = 0;
            } else {
              // First tap or too far from last tap
              console.log("First tap detected, waiting for second tap...");
              lastTapTime = currentTime;
              lastTapX = touchEndX;
              lastTapY = touchEndY;
            }
          }
        });
      }

      // Function to generate random ASCII divider line for popups
      function generateASCIIDivider() {
        const patterns = generateRandomPatterns();
        const allPatterns = [
          ...patterns.dotClusters,
          ...patterns.linePatterns,
          ...patterns.mixedPatterns,
          ...patterns.bracketPatterns,
          ...patterns.slashPatterns,
          ...patterns.plusPatterns,

      // Preload all images in parallel for faster loading
      function preloadImages() {
        const loadPromises = artistImages.map((artist) => {
          return new Promise((resolve, reject) => {
            const texture = textureLoader.load(
              artist.path,
              (loadedTexture) => {
                // Optimize texture settings for better performance
                loadedTexture.generateMipmaps = false;
                loadedTexture.minFilter = THREE.LinearFilter;
                loadedTexture.magFilter = THREE.LinearFilter;
                loadedTexture.format = THREE.RGBAFormat;
                loadedTexture.flipY = true;

                resolve({ artist, texture: loadedTexture });
              },
              undefined,
              (error) => {
                console.warn(`Failed to load image: ${artist.path}`, error);
                reject(error);
              }
            );
          });
        });

        return Promise.all(loadPromises);
      }

      // Function to create ASCII frame texture with image
      function createASCIIFrameTexture(imageTexture, artistName) {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        // Set canvas size with padding for ASCII frame
        const padding = 20; // Space for frame
        const textHeight = 25; // Space for text above frame
        const standardImageWidth = 400; // Fixed width for all images
        const imageWidth = imageTexture.image.width;
        const imageHeight = imageTexture.image.height;

        // Calculate proportional height based on standard width
        const proportionalImageHeight =
          (imageHeight / imageWidth) * standardImageWidth;

        canvas.width = standardImageWidth + padding * 2;
        canvas.height = proportionalImageHeight + padding * 2 + textHeight;

        // Draw text above the frame (white, monospace font)
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px IBMPlexMono, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`[*] ${artistName}`, canvas.width / 2, textHeight / 2);

        // ASCII frame coordinates
        const frameX = padding;
        const frameY = textHeight;
        const frameWidth = standardImageWidth;
        const frameHeight = proportionalImageHeight;

        // Corner brackets removed

        // Draw the actual image inside the frame
        ctx.drawImage(
          imageTexture.image,
          frameX,
          frameY,
          frameWidth,
          frameHeight
        );

        return canvas;
      }

            framedTexture.generateMipmaps = false;
            framedTexture.minFilter = THREE.LinearFilter;
            framedTexture.magFilter = THREE.LinearFilter;

            // Calculate aspect ratio from framed canvas
            const aspectRatio = framedCanvas.width / framedCanvas.height;
            const baseHeight = 3.5; // Slightly larger to accommodate frame
            const width = baseHeight * aspectRatio;

            // Create geometry with proper aspect ratio
            const geometry = new THREE.PlaneGeometry(width, baseHeight);

            const material = new THREE.MeshBasicMaterial({

      // Function to create connections between images (optimized)
      function createConnections() {
        // Reduce number of connections for better performance - more aggressive on mobile
        const maxConnections = isMobile
          ? Math.min(imagePlanes.length * 0.3, 10)
          : Math.min(imagePlanes.length * 0.5, 20); // Limit total connections
        let connectionCount = 0;

        for (
          let i = 0;
          i < imagePlanes.length && connectionCount < maxConnections;
          i++
        ) {
          // Each image connects to 1-2 other images (reduced from 1-3)
          const numConnections = Math.floor(Math.random() * 2) + 1;
          const connectedIndices = new Set();

          // Ensure we don't connect to the same image
          while (
            connectedIndices.size < numConnections &&
            connectedIndices.size < imagePlanes.length - 1 &&
            connectionCount < maxConnections
          ) {
            const randomIndex = Math.floor(Math.random() * imagePlanes.length);
            if (randomIndex !== i) {
              connectedIndices.add(randomIndex);
            }
          }

          // Create lines to connected images
          connectedIndices.forEach((targetIndex) => {
            if (connectionCount >= maxConnections) return;

            const startPos = imagePlanes[i].position;
            const endPos = imagePlanes[targetIndex].position;

            // Create thick dashed line by using multiple parallel lines
            const direction = new THREE.Vector3().subVectors(endPos, startPos);
            const length = direction.length();
            direction.normalize();

            // Create perpendicular vector for thickness
            const perpendicular = new THREE.Vector3(0, 1, 0);
            const cross = new THREE.Vector3()
              .crossVectors(direction, perpendicular)
              .normalize();

            // Create 3 parallel lines for thickness
            for (let i = -1; i <= 1; i++) {
              const offset = cross.clone().multiplyScalar(i * 0.03);
              const offsetStart = startPos.clone().add(offset);
              const offsetEnd = endPos.clone().add(offset);

              const points = [offsetStart, offsetEnd];

              const geometry = new THREE.BufferGeometry().setFromPoints(points);

              // Create line material with thick green dashed appearance
              const material = new THREE.LineDashedMaterial({
                color: 0x00ff00,
                dashSize: 0.25,
                gapSize: 0.05,
                depthTest: true,
                depthWrite: false,
              });

              const line = new THREE.Line(geometry, material);
              line.renderOrder = -10; // Render far behind other objects
              line.frustumCulled = true;

              // Compute line distances for dashed material
              line.computeLineDistances();

              connectionLines.push(line);
              scene.add(line);
            }
            connectionCount++;
          });
        }

          asciiCanvas.height / 2
        );

        // Draw another rectangle in center
        asciiCtx.fillStyle = "rgba(0, 255, 0, 0.8)";
        asciiCtx.fillRect(
          asciiCanvas.width / 2 - 100,
          asciiCanvas.height / 2 - 50,
          200,
          100
        );

        console.log("Drew immediate test text and rectangle");

        // Test div overlay removed - clean interface

        // Don't create initial ASCII elements - start clean
        console.log("ASCII elements system initialized - starting clean");

        // Test if canvas is actually visible
        setTimeout(() => {
          const canvas = document.getElementById("ascii-canvas");
          if (canvas) {
            console.log("Canvas found in DOM:", canvas);
            console.log(
              "Canvas computed style:",
              window.getComputedStyle(canvas)
            );
            console.log(
              "Canvas offset:",
              canvas.offsetWidth,
              "x",
              canvas.offsetHeight
            );
          } else {
            console.log("ERROR: Canvas not found in DOM!");
          }
        }, 1000);
      }

      function resizeASCIICanvas() {
        asciiCanvas.width = window.innerWidth;
        asciiCanvas.height = window.innerHeight;
      }

      function createASCIIElement() {
        let pattern =
          asciiPatterns[Math.floor(Math.random() * asciiPatterns.length)];
        let element = {
          pattern: pattern,
          x: window.innerWidth / 2 + Math.random() * 200 - 100,
          y: window.innerHeight / 2 + Math.random() * 200 - 100,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          rotation: 0,
          rotationSpeed: (Math.random() - 0.5) * 0.02,
          scale: Math.random() * 0.4 + 0.8,
          alpha: Math.random() * 100 + 155,
          timeOffset: Math.random() * 100,
          life: 0,
          maxLife: Math.random() * 300 + 200,
        };
        asciiElements.push(element);
      }

      function updateASCIIElements() {
        asciiTime += 0.02;

        // Check network position to determine if ASCII elements should appear
        let networkPosition = getNetworkPosition();
        let shouldShowASCII =
          networkPosition.x < -0.1 && networkPosition.y < -0.1;

        // Debug: log position occasionally
        if (Math.random() < 0.001) {
          console.log(
            "Network position:",
            networkPosition,
            "Should show ASCII:",
            shouldShowASCII
          );
        }

        if (shouldShowASCII && asciiElements.length < 8) {
          // Create new ASCII elements from center to right up
          if (Math.random() < 0.1) {
            createASCIIElement();
            console.log("Created ASCII element! Total:", asciiElements.length);
          }
        }

        // Also create elements occasionally regardless of position for testing
        if (asciiElements.length < 3 && Math.random() < 0.01) {
          createASCIIElement();
          console.log(
            "Created test ASCII element! Total:",
            asciiElements.length
          );
        }

        // Update existing elements
        for (let i = asciiElements.length - 1; i >= 0; i--) {
          let element = asciiElements[i];
          element.life++;

          // Remove old elements
          if (element.life > element.maxLife) {
            asciiElements.splice(i, 1);
            continue;
          }

          // Update position
          element.x += element.vx;
          element.y += element.vy;

          // Add gentle floating motion
          let breathX = Math.sin(asciiTime + element.timeOffset) * 2;
          let breathY = Math.cos(asciiTime + element.timeOffset * 0.7) * 1;

          element.x += breathX;
          element.y += breathY;

          // Rotation
          element.rotation += element.rotationSpeed;

          // Fade out over time
          element.alpha = Math.max(
            0,
            255 - (element.life / element.maxLife) * 100
          );
        }
      }

      function drawASCIIElements() {
        asciiCtx.clearRect(0, 0, asciiCanvas.width, asciiCanvas.height);

        // Debug: log drawing occasionally
        if (asciiElements.length > 0 && Math.random() < 0.01) {
          console.log("Drawing", asciiElements.length, "ASCII elements");
        }

        for (let element of asciiElements) {
          asciiCtx.save();
          asciiCtx.translate(element.x, element.y);
          asciiCtx.rotate(element.rotation);
          asciiCtx.scale(element.scale, element.scale);

          // Draw each line of the ASCII pattern
          for (let y = 0; y < element.pattern.length; y++) {
            let line = element.pattern[y];
            let lineX = (-line.length * 8) / 2;
            let lineY = (-element.pattern.length * 10) / 2 + y * 10;

            // Add gentle floating motion to each line
            let lineFloatX = Math.sin(asciiTime + y * 0.1) * 1;
            let lineFloatY = Math.cos(asciiTime + y * 0.1) * 0.5;

            asciiCtx.save();
            asciiCtx.translate(lineX + lineFloatX, lineY + lineFloatY);

            // Draw the line in sharp green
            asciiCtx.fillStyle = `rgba(0, 255, 0, ${Math.max(
              0.9,
              element.alpha / 255
            )})`;
            asciiCtx.font = "bold 14px monospace";
            asciiCtx.textAlign = "left";
            asciiCtx.textBaseline = "top";
            asciiCtx.fillText(line, 0, 0);
            asciiCtx.restore();
          }
          asciiCtx.restore();
        }
      }

      function getNetworkPosition() {
        // Get the current camera/network position
        let position = {
          x: (camera.position.x - 0) / 50, // Normalize to -1 to 1
          y: (camera.position.y - 0) / 50,
          z: (camera.position.z - 25) / 25,
        };
        return position;
      }

      // Create ASCII elements as HTML divs (working solution!)
      function createHTMLASCIIElements() {
        console.log("Creating HTML ASCII elements...");

        // Create initial ASCII elements
        for (let i = 0; i < 3; i++) {
          createHTMLASCIIElement();
        }
      }

      function createHTMLASCIIElement() {
        let pattern =
          asciiPatterns[Math.floor(Math.random() * asciiPatterns.length)];
        let asciiDiv = document.createElement("div");
        asciiDiv.className = "ascii-element";
        asciiDiv.style.position = "fixed";
        asciiDiv.style.left = Math.random() * window.innerWidth + "px";
        asciiDiv.style.top = Math.random() * window.innerHeight + "px";
        asciiDiv.style.color = "lime";
        asciiDiv.style.fontFamily = "monospace";
        asciiDiv.style.fontSize = "12px";
        asciiDiv.style.fontWeight = "bold";
        asciiDiv.style.zIndex = "999999";
        asciiDiv.style.pointerEvents = "none";
        asciiDiv.style.whiteSpace = "pre";
        asciiDiv.style.lineHeight = "1.2";
        asciiDiv.style.textAlign = "left";
        asciiDiv.style.transform = `scale(${Math.random() * 0.5 + 0.8})`;
        asciiDiv.style.opacity = "0.9";
        asciiDiv.style.transition = "all 0.1s ease-out";
        asciiDiv.textContent = pattern.join("\n");

        // Add gentle breathing animation properties
        asciiDiv.vx = 0; // No initial velocity
        asciiDiv.vy = 0;
        asciiDiv.rotation = 0;
        asciiDiv.rotationSpeed = (Math.random() - 0.5) * 0.005; // Very slow rotation
        asciiDiv.timeOffset = Math.random() * Math.PI * 2;
        asciiDiv.life = 0;
        asciiDiv.maxLife = Math.random() * 300 + 200;

        // Add very subtle breathing properties
        asciiDiv.floatAmplitude = Math.random() * 3 + 2; // 2-5px very gentle floating
        asciiDiv.floatSpeed = Math.random() * 0.002 + 0.001; // Extremely slow breathing
        asciiDiv.floatPhase = Math.random() * Math.PI * 2;
        asciiDiv.driftX = 0; // No drift, just gentle breathing
        asciiDiv.driftY = 0;

        document.body.appendChild(asciiDiv);
        console.log("Created HTML ASCII element with pattern:", pattern[0]);
        return asciiDiv;
      }

      // Track previous camera position to detect movement
      let previousCameraPosition = { x: 0, y: 0, z: 0 };
      let isDragging = false;
      let dragStartTime = 0;

      function updateHTMLASCIIElements() {
        asciiTime += 0.01;

        // Get current camera position
        let currentPosition = {
          x: camera.position.x,
          y: camera.position.y,
          z: camera.position.z,
        };

        // Calculate movement
        let movement = {
          x: currentPosition.x - previousCameraPosition.x,
          y: currentPosition.y - previousCameraPosition.y,
          z: currentPosition.z - previousCameraPosition.z,
        };

        // Check if there's significant movement (dragging)
        let currentlyDragging =
          Math.abs(movement.x) > 0.5 ||
          Math.abs(movement.y) > 0.5 ||
          Math.abs(movement.z) > 0.5;

        // Detect drag start
        if (currentlyDragging && !isDragging) {
          isDragging = true;
          dragStartTime = Date.now();
          createAnimatedASCIIElement();
        }

        // Detect drag end
        if (!currentlyDragging && isDragging) {
          isDragging = false;
        }

        // Update previous position
        previousCameraPosition = { ...currentPosition };

        // Update existing elements
        const elements = document.querySelectorAll(".ascii-element");
        for (let i = elements.length - 1; i >= 0; i--) {
          let element = elements[i];
          element.life++;

          // Remove elements after 5 seconds (300 frames at 60fps)
          if (element.life > 300) {
            // Fade out before removing
            element.style.transition = "opacity 0.5s ease-out";
            element.style.opacity = "0";
            setTimeout(() => {
              if (element.parentNode) {
                element.remove();
              }
            }, 500);
            continue;
          }

          // Update animation for elements that are still animating
          if (element.isAnimating) {
            let progress = Math.min(
              1,
              (Date.now() - element.startTime) / element.animationDuration
            );

            // Ease out animation
            let easedProgress = 1 - Math.pow(1 - progress, 3);

            // Calculate position from center to target
            let currentX =
              element.startX +
              (element.targetX - element.startX) * easedProgress;
            let currentY =
              element.startY +
              (element.targetY - element.startY) * easedProgress;

            // Calculate scale from 0 to 1
            let currentScale = easedProgress;

            // Calculate opacity from 0 to 1
            let currentOpacity = easedProgress;

            element.style.left = currentX + "px";
            element.style.top = currentY + "px";
            element.style.transform = `scale(${currentScale})`;
            element.style.opacity = currentOpacity;

            // Mark as finished animating
            if (progress >= 1) {
              element.isAnimating = false;
            }
          } else {
            // Organic breathing animation - focus on scale changes to feel alive
            let time = asciiTime * element.floatSpeed + element.floatPhase;

            // Keep position static - no movement, just breathing
            let currentLeft = parseFloat(element.style.left);
            let currentTop = parseFloat(element.style.top);
            element.style.left = currentLeft + "px";
            element.style.top = currentTop + "px";

            // Continuous gentle breathing through scale changes
            let baseScale = 0.8;
            let breathScale = Math.sin(time) * 0.03; // Very subtle scale breathing
            let scale = baseScale + breathScale;

            // Very gentle rotation
            element.rotation += element.rotationSpeed;

            // Apply breathing scale and rotation
            element.style.transform = `scale(${scale}) rotate(${element.rotation}rad)`;

            // Keep opacity stable - focus on scale breathing
            element.style.opacity = "0.7";
          }
        }
      }

      function createAnimatedASCIIElement() {
        // Create ASCII element that animates from center to empty space
        let pattern =
          asciiPatterns[Math.floor(Math.random() * asciiPatterns.length)];
        let asciiDiv = document.createElement("div");
        asciiDiv.className = "ascii-element";
        asciiDiv.style.position = "fixed";
        asciiDiv.style.color = "lime";
        asciiDiv.style.fontFamily = "monospace";
        asciiDiv.style.fontSize = "12px";
        asciiDiv.style.fontWeight = "bold";
        asciiDiv.style.zIndex = "999999";
        asciiDiv.style.pointerEvents = "none";
        asciiDiv.style.whiteSpace = "pre";
        asciiDiv.style.lineHeight = "1.2";
        asciiDiv.style.textAlign = "left";
        asciiDiv.textContent = pattern.join("\n");

        // Start from center of screen
        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;

        // Choose random empty space as target
        let targetX = Math.random() * window.innerWidth;
        let targetY = Math.random() * window.innerHeight;

        // Set initial position (center)
        asciiDiv.style.left = centerX + "px";
        asciiDiv.style.top = centerY + "px";

        // Set initial scale and opacity (0)
        asciiDiv.style.transform = "scale(0)";
        asciiDiv.style.opacity = "0";

        // Animation properties
        asciiDiv.isAnimating = true;
        asciiDiv.startTime = Date.now();
        asciiDiv.animationDuration = 1000; // 1 second animation
        asciiDiv.startX = centerX;
        asciiDiv.startY = centerY;
        asciiDiv.targetX = targetX;
        asciiDiv.targetY = targetY;

        // Add gentle breathing properties for after animation
        asciiDiv.vx = 0; // No velocity, just gentle breathing
        asciiDiv.vy = 0;
        asciiDiv.rotation = 0;
        asciiDiv.rotationSpeed = (Math.random() - 0.5) * 0.005; // Very slow rotation
        asciiDiv.timeOffset = Math.random() * Math.PI * 2;
        asciiDiv.life = 0;
        asciiDiv.maxLife = 300; // 5 seconds at 60fps

        // Add very subtle breathing properties
        asciiDiv.floatAmplitude = Math.random() * 3 + 2; // 2-5px very gentle floating
        asciiDiv.floatSpeed = Math.random() * 0.002 + 0.001; // Extremely slow breathing
        asciiDiv.floatPhase = Math.random() * Math.PI * 2;
        asciiDiv.driftX = 0; // No drift, just gentle breathing
        asciiDiv.driftY = 0;

        document.body.appendChild(asciiDiv);
        console.log(
          "Created animated ASCII element from center to empty space"
        );
      }

      // Optimized animation loop
      function animate() {
        requestAnimationFrame(animate);

        // Update camera matrix for frustum culling
        cameraMatrix.multiplyMatrices(
          camera.projectionMatrix,
          camera.matrixWorldInverse
        );
        frustum.setFromProjectionMatrix(cameraMatrix);

        // Constant slow rotation around Y-axis - reduce on mobile
        if (!isMobile) {
          scene.rotation.y += rotationSpeed;
        }

        // Optimized billboard behavior with frustum culling
        imagePlanes.forEach((plane) => {
          // Only update billboard behavior if plane is in view
          if (frustum.intersectsObject(plane)) {
            plane.lookAt(camera.position);
            plane.visible = true;
          } else {
            plane.visible = false; // Hide objects outside frustum
          }
        });

        controls.update();
        renderer.render(scene, camera);

        // Update HTML ASCII elements
        updateHTMLASCIIElements();
      }

      // Optimized window resize handler
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Resize ASCII canvas
        if (asciiCanvas) {
          resizeASCIICanvas();
        }

        // Update mobile detection on resize
        const newIsMobile =
          /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
            navigator.userAgent
          ) || window.innerWidth <= 768;
        if (newIsMobile !== isMobile) {
          // Reload page if mobile state changes significantly
          location.reload();
        }
      });

      // Initialize ASCII elements system
      initASCIIElements();

      // Start animation
      animate();

      // Delicate mouse-tracking gradient effect - disable on mobile for performance
      if (!isMobile) {
        document.addEventListener("mousemove", (event) => {
          const x = (event.clientX / window.innerWidth) * 100;
          const y = (event.clientY / window.innerHeight) * 100;

          document.body.style.background = `
            radial-gradient(
              circle at ${x}% ${y}%,
              rgba(90, 90, 90, 0.3) 0%,
              rgba(70, 70, 70, 0.15) 40%,
              rgba(50, 50, 50, 0.08) 70%,
              rgba(30, 30, 30, 0) 100%
            ),
            radial-gradient(
              ellipse at 50% 50%,
              #c0c0c0 0%,
              #a8a8a8 20%,
              #808080 40%,
              #585858 60%,
              #303030 80%,
              #181818 95%,
              #080808 100%
            ),
            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="600" height="600" filter="url(%23noise)" opacity="0.95"/></svg>')`;
          document.body.style.backgroundBlendMode =
            "normal, multiply, multiply";
          document.body.style.backgroundSize = "cover, cover, 200px 200px";
        });
      }
    </script>
  </body>
